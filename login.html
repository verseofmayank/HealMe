<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function () {
            var t = localStorage.getItem("healme-theme") ||
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Heal Me</title>
    <link rel="icon" type="image/png" href="images/hm.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body class="auth-page">

    <div class="wrapper">
        <form id="loginForm" novalidate>
            <h2>Login</h2>
            <div class="input-group">
                <span class="icon"><i class="fas fa-user"></i></span>
                <input type="text" id="loginUsername" placeholder="Username" required>
            </div>
            <div class="input-group">
                <span class="icon"><i class="fas fa-lock"></i></span>
                <input type="password" id="loginPassword" placeholder="Password" required>
            </div>
            <div id="loginMessage" class="form-message"></div>
            <div class="forgot-pass">
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="sign-link">
                <p>Don't have an account? <a href="signup.html" class="register-link">Register</a></p>
            </div>
        </form>
    </div>

    <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>

    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const username = document.getElementById("loginUsername").value;
            const password = document.getElementById("loginPassword").value;
            const msg = document.getElementById("loginMessage");
            const result = HealMeAuth.login(username, password);
            msg.textContent = result.message;
            msg.className = "form-message show " + (result.ok ? "success" : "error");
            if (result.ok) {
                setTimeout(() => { window.location.href = "healme.html"; }, 700);
            }
        });
    </script>
</body>

</html>
