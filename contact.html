<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function () {
            var t = localStorage.getItem("healme-theme") ||
                (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Heal Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" type="image/png" href="images/hm.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <div class="hero">
        <nav>
            <img src="images/hm.png" alt="Heal Me" class="logo">
            <ul>
                <li><a href="healme.html">Home</a></li>
                <li><a href="healme.html#services">Services</a></li>
                <li><a href="blogs.html">Blog</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button class="theme-toggle-nav" aria-label="Toggle dark mode">🌙</button>
            <img src="images/hm.png" alt="user" class="user-pic" onclick="toggleMenu()">
            <div class="sub-menu-wrap" id="subMenu">
                <div class="sub-menu">
                    <div class="user-info">
                        <img src="images/hm.png">
                        <h3 id="navUserName">Guest</h3>
                    </div>
                    <hr>
                    <a href="blogs.html" class="sub-menu-link">
                        <img src="images/help.png">
                        <p>Health Blogs</p>
                        <span>&gt;</span>
                    </a>
                    <a href="#" id="logoutLink" class="sub-menu-link">
                        <img src="images/logout.png">
                        <p>Logout</p>
                        <span>&gt;</span>
                    </a>
                </div>
            </div>
        </nav>
        <div class="contact-container">
            <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
                <div class="contact-left-title">
                    <h2>Get in touch</h2>
                    <hr>
                </div>
                <input type="hidden" name="access_key" value="83962cff-04f5-46ea-86db-cd1b49bfd853">
                <input type="text" name="name" placeholder="Your Name" class="contact-inputs" required>
                <input type="email" name="email" placeholder="Your Email" class="contact-inputs" required>
                <textarea name="message" placeholder="Your Message" class="contact-inputs" required></textarea>
                <button type="submit">Submit <img src="images/arrow_icon.png" alt=""></button>
            </form>
            <div class="contact-right">
                <img src="images/WI2.png" alt="Healthcare illustration">
            </div>
        </div>
    </div>

    <footer id="footer">
        <div class="container-fluid">
            <div class="footer-content">
                <div class="footer-section about">
                    <h1 class="logo-text">Heal Me</h1>
                    <p id="ps">
                        Heal Me is a platform that provides a wide range of health services to users. It is a
                        one-stop solution for all your health-related queries.
                    </p>
                </div>
            </div>
        </div>
        <div class="social-icons mt-4">
            <a class="fhov" target="_blank" href="https://www.facebook.com/"><i class="fab fa-facebook"></i></a>
            &nbsp;
            <a class="fhov" target="_blank" href="https://www.instagram.com/"><i class="fab fa-instagram"></i></a>
            &nbsp;
            <a class="fhov" target="_blank" href="https://x.com/"><i class="fab fa-twitter"></i></a>
            &nbsp;
            <a class="fhov" target="_blank" href="https://www.linkedin.com/"><i class="fab fa-linkedin"></i></a>
            &nbsp;
            <a class="fhov" target="_blank" href="https://github.com/"><i class="fab fa-github"></i></a>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="theme.js"></script>
    <script>
        let subMenu = document.getElementById("subMenu");
        function toggleMenu() {
            subMenu.classList.toggle("open-menu");
        }
    </script>
</body>

</html>
